# Paper-Trading-Konfiguration. Alle Betraege in USD.
mode: paper              # live ist absichtlich nicht implementiert
network: base            # GeckoTerminal-Netzwerk-ID (base, eth, arbitrum, ...)
start_capital_usd: 1000
tick_seconds: 900
db_path: data/autotrader.db

limits:
  min_trade_usd: 5
  max_trade_usd: 50
  max_daily_usd: 150               # Summe aller Kaeufe pro UTC-Tag
  approval_above_usd: 25           # darueber: Freigabe per CLI noetig
  approval_ttl_minutes: 60
  max_token_pct_of_slot: 0.25      # Diversifikation: max. Anteil pro Token am Slot
  max_open_positions_per_slot: 6
  max_trade_pct_of_liquidity: 0.005
  min_liquidity_usd: 50000
  min_volume_24h_usd: 25000
  min_pool_age_hours: 48
  stop_loss_pct: 15
  take_profit_pct: 40              # verkauft die Haelfte
  max_drawdown_pct: 30             # globaler Kill-Switch

slots:                             # "neue Wallets" als getrennte Teilportfolios
  max_slots: 5
  spawn_profit_pct: 25             # ab +25% Slot-Gewinn wird abgespalten
  spawn_fraction: 0.5              # Anteil des Gewinns fuer den neuen Slot
  min_spawn_usd: 20
  strategies: [momentum, conservative, contrarian]

security:                          # Honeypot- und Contract-Pruefung vor jedem Kauf (fail-closed)
  enabled: true
  max_tax: 0.05
  min_holders: 100

regime:                            # grobe Heuristik, im Paper-Betrieb auswerten
  enabled: true
  min_breadth: 0.35                # Anteil Kandidaten mit positivem 24h-Kurs
  min_median_change_24h: -8.0

strategy_params:                   # Startwerte, die Review darf sie in Grenzen anpassen
  momentum: {min_h1: 3, h24_min: 5, h24_max: 80}
  conservative: {min_liq: 250000, h24_min: 0, h24_max: 25}
  contrarian: {h24_max: -15, min_h1: 0, min_liq: 100000}

adapt:
  review_interval_hours: 168       # woechentliche Review (nur mit research.provider: claude)
  min_closed_trades_for_pause: 20  # Strategie pausiert, wenn Netto nach Kosten negativ
  min_closed_trades_for_tuning: 30 # darunter keine Parameteraenderung (Overfitting-Schutz)
  max_rel_change: 0.25             # max. Aenderung pro Review relativ zum aktuellen Wert
  bounds:
    momentum: {min_h1: [1, 10], h24_min: [0, 20], h24_max: [30, 150]}
    conservative: {min_liq: [100000, 1000000], h24_min: [-5, 10], h24_max: [10, 50]}
    contrarian: {h24_max: [-40, -8], min_h1: [0, 5], min_liq: [50000, 500000]}

research:
  provider: rules                  # rules | claude
  model: claude-sonnet-5-5
  web_search: true

paper:
  fee_pct: 0.3
  slippage_pct: 0.5
